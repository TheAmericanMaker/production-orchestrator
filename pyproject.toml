[project]
name = "production-orchestrator"
version = "0.0.1"
description = "A Strands-powered production scheduling agent for small embroidery shops"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Production Orchestrator Team" }]
dependencies = [
    "strands-agents[ollama]==1.51.0",
]

[project.scripts]
production-orchestrator-spike = "production_orchestrator.spike:main"
production-orchestrator-restart-spike = "production_orchestrator.restart_spike:main"
production-orchestrator-demo = "production_orchestrator.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
patch = ["subprocess"]

[tool.ruff]
line-length = 100
target-version = "py311"
