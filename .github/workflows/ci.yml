name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync --locked
      - run: uv export --locked --no-dev --no-emit-project --output-file /tmp/requirements.txt
      - run: uvx pip-audit -r /tmp/requirements.txt
      - run: uv run ruff check .
      - run: uv run pytest --cov=production_orchestrator --cov-report=term-missing --cov-fail-under=70
